 "Para flotar y captar luz":"🪷 ☀️","Para guardar piedras":"🪨","Para tener un tronco":"🪵",
 "Porque allí hay más luz":"🪟 ☀️","Porque allí hay más tierra":"🪟 🟫","Porque allí hay menos luz":"🪟 🌑",
 "A los insectos":"🐝","A los peces":"🐟","A los gatos":"🐈"
};
function illustrate(option){
 if(option==="Las raíces")return part("La raíz");
 if(option==="Los frutos")return part("El fruto");
 if(option==="La hoja")return part("Las hojas");
 if(Object.hasOwn(plantParts,option))return part(option);
 if(Object.hasOwn(types,option))return svg(line("M15 75h70","#c9aa81",2)+types[option]);
 const names=option.includes(",")?option.replace(" y ",", ").split(", ").map(x=>x[0].toUpperCase()+x.slice(1)):[option==="Nace otra vez"?"Nace":option];
 if(names.every(name=>Object.hasOwn(stages,name))){
  return '<span class="sequence">'+names.map(name=>svg(line("M12 72h76","#c9aa81",2)+stages[name],"15 12 70 68")).join('<span>→</span>')+'</span>';
 }
 return '<span class="emoji">'+(icons[option]??"")+'</span>';
}

const get=id=>document.getElementById(id);
const [nav,step,progress,pic,question,listen,choices,feedback,next]=["missions","step","progress","pic","question","listen","choices","feedback","next"].map(get);
const voice=window.speechSynthesis;
let mission=0,index=0,answerText="";
const completed=new Set();
const tabs=missions.map(([name],i)=>{
 const button=document.createElement("button");button.textContent=name;
 button.onclick=()=>{mission=i;index=0;render(true)};
 nav.append(button);return button;
});
function render(focus){
 voice?.cancel();
 tabs.forEach((tab,i)=>tab.setAttribute("aria-pressed",i===mission));
 const items=missions[mission][1];
 progress.max=items.length;progress.value=index;
 choices.replaceChildren();feedback.textContent="";next.hidden=true;listen.hidden=!voice;
 if(index===items.length){
  completed.add(mission);step.textContent="MISIÓN COMPLETADA";pic.textContent="🏅";
  question.textContent=completed.size===missions.length?"¡Has completado todo el repaso!":"¡Misión completada!";
  feedback.textContent=completed.size+" de "+missions.length+" misiones completadas.";
  listen.hidden=true;next.textContent="Volver a jugar";next.hidden=false;
 }else{
  const [symbol,prompt,correct,...rest]=items[index];
  const explanation=rest.pop();
  const options=[correct,...rest];
  const shift=(mission+index+1)%3;
  const ordered=[...options.slice(shift),...options.slice(0,shift)];
  step.textContent="PREGUNTA "+(index+1)+" DE "+items.length;
  pic.textContent=symbol;question.textContent=prompt;
  answerText=[prompt,...ordered].join(". ");
  ordered.forEach(option=>{
   const button=document.createElement("button");const picture=document.createElement("span");
   picture.className="option-picture";picture.setAttribute("aria-hidden","true");
   picture.innerHTML=illustrate(option);
   const label=document.createElement("span");label.textContent=option;
   button.append(picture,label);
   button.onclick=()=>{
    if(option!==correct){
     button.classList.add("retry");button.disabled=true;
     feedback.textContent="Prueba otra vez.";choices.querySelector("button:not(:disabled)")?.focus();return;
    }
    button.classList.add("correct");choices.querySelectorAll("button").forEach(b=>b.disabled=true);
    feedback.textContent="¡Bien! "+explanation;progress.value=index+1;
    next.textContent=index+1===items.length?"Terminar misión →":"Siguiente →";next.hidden=false;next.focus();
   };choices.append(button);
  });
 }
 if(focus)question.focus();
}
listen.onclick=()=>{
 voice.cancel();const speech=new SpeechSynthesisUtterance(answerText);
 speech.lang="es-ES";speech.rate=.85;voice.speak(speech);
};
next.onclick=()=>{index=index===missions[mission][1].length?0:index+1;render(true)};
render(false);
</script>
</html>
